C.N=7; C.displayExposure=12;
specColor=function(a){let mx=Math.max(...a,1e-9),n=a.map(v=>cl(v/mx,0,1)),mn=Math.min(...n),span=Math.max(1e-5,1-mn);if(span<.018)return 'rgb(255 248 224)';let q=n.map(v=>cl((v-mn)/span,0,1)).map(v=>.035+.965*Math.pow(v,.68));let mean=(q[0]+q[1]+q[2])/3,chroma=1.38;q=q.map(v=>cl(mean+(v-mean)*chroma,0,1));return `rgb(${Math.round(q[0]*255)} ${Math.round(q[1]*255)} ${Math.round(q[2]*255)})`};

groups=function(records){let M=new Map;for(let r of records)for(let e of r.events){let a=M.get(e.path)||[];a.push(e);M.set(e.path,a)}let out=[];for(let [key,a] of M)for(let cluster of v46clusters(a)){if(!cluster.length)continue;let s=[0,0,0];for(let e of cluster){s[0]+=e.spec[0];s[1]+=e.spec[1];s[2]+=e.spec[2]}s=s.map(v=>v/cluster.length);let P=cluster.length>=3?hull(cluster.map(e=>e.p)):cluster.map(e=>e.p);out.push({key,P,spec:s,color:specColor(s),power:cluster.reduce((z,e)=>z+e.energy,0)/cluster.length,rep:cluster[Math.floor(cluster.length/2)],count:cluster.length})}return out.sort((a,b)=>b.power-a.power)};
cone=function(){let s=src(),a=norm(sub(aim(),s)),he=Math.abs(a.z)<.9?V(0,0,1):V(1,0,0),u=norm(cross(a,he)),v=norm(cross(u,a)),th=beamHalfRad(),sp=proj(s,c),gain=Math.min(powerGain(),12);if(!sp)return;let edge=[];for(let k=0;k<18;k++){let A=k*Math.PI/9,d=norm(add(mul(a,Math.cos(th)),mul(add(mul(u,Math.cos(A)),mul(v,Math.sin(A))),Math.sin(th)))),e=sceneHit(s,d,-1,false);edge.push(e?e.p:add(s,mul(d,70)))}let rings=[.32,.62,.88,1].map(f=>edge.map(e=>add(s,mul(sub(e,s),f))));g.save();g.globalCompositeOperation='screen';for(let ri=rings.length-1;ri>=0;ri--){let P=rings[ri].map(x=>proj(x,c)).filter(Boolean);if(P.length<3)continue;let al=[.072,.052,.034,.022][ri]*(.78+Math.min(gain,6)*.042);for(let k=0;k<P.length;k++){let p=P[k],q=P[(k+1)%P.length];g.beginPath();g.moveTo(sp.x,sp.y);g.lineTo(p.x,p.y);g.lineTo(q.x,q.y);g.closePath();g.fillStyle=`rgba(255,228,145,${al})`;g.fill()}if(ri===rings.length-1){g.beginPath();g.moveTo(P[0].x,P[0].y);P.slice(1).forEach(q=>g.lineTo(q.x,q.y));g.closePath();g.strokeStyle='rgba(255,240,198,.07)';g.stroke()}}let ap=proj(aim(),c);if(ap){g.beginPath();g.moveTo(sp.x,sp.y);g.lineTo(ap.x,ap.y);g.lineWidth=1.7+Math.min(2,gain*.24);g.strokeStyle='rgba(255,240,196,.42)';g.shadowColor='rgba(255,220,110,.9)';g.shadowBlur=9+Math.min(14,gain);g.stroke();g.shadowBlur=0;g.lineWidth=1;g.strokeStyle='rgba(255,252,235,.72)';g.stroke()}g.restore()};
footprint=function(B){if(!B||!B.P.length)return;let Q=B.P.map(x=>proj(x,c));if(Q.some(x=>!x))return;let a=cl(.14+.86*tonePower(B.power),.12,.98);g.save();g.lineJoin='round';g.lineCap='round';if(Q.length===1){let p=Q[0],r=8+10*a,rg=g.createRadialGradient(p.x,p.y,0,p.x,p.y,r);rg.addColorStop(0,B.color);rg.addColorStop(.55,B.color);rg.addColorStop(1,'rgba(255,255,255,0)');g.globalAlpha=a*.9;g.fillStyle=rg;g.fillRect(p.x-r,p.y-r,2*r,2*r);g.restore();return}if(Q.length===2){g.beginPath();g.moveTo(Q[0].x,Q[0].y);g.lineTo(Q[1].x,Q[1].y);g.strokeStyle=B.color;g.lineWidth=4+7*a;g.globalAlpha=a*.62;g.shadowColor=B.color;g.shadowBlur=14;g.stroke();g.restore();return}let xs=Q.map(x=>x.x),ys=Q.map(x=>x.y),x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys),cx=(x0+x1)/2,cy=(y0+y1)/2,rad=Math.max(12,Math.hypot(x1-x0,y1-y0)*.58),gl=g.createRadialGradient(cx,cy,0,cx,cy,rad);gl.addColorStop(0,B.color);gl.addColorStop(.62,B.color);gl.addColorStop(1,'rgba(255,255,255,0)');g.beginPath();g.moveTo(Q[0].x,Q[0].y);Q.slice(1).forEach(x=>g.lineTo(x.x,x.y));g.closePath();g.globalAlpha=a*.30;g.shadowColor=B.color;g.shadowBlur=20;g.fillStyle=B.color;g.fill();g.shadowBlur=0;g.globalAlpha=a*.82;g.fillStyle=B.color;g.fill();g.globalAlpha=a*.24;g.lineWidth=2.2;g.strokeStyle=B.color;g.stroke();g.clip();g.globalAlpha=a*.28;g.fillStyle=gl;g.fillRect(cx-rad,cy-rad,2*rad,2*rad);g.restore()};
