<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}body{margin:0;background:#0d1015;color:#fff;font:14px -apple-system,Arial;padding-bottom:190px}main{padding:10px;max-width:850px;margin:auto}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:22px;margin:0}button{background:#242b36;color:#fff;border:1px solid #465064;border-radius:10px;padding:9px 12px;font-weight:700}#st{display:block;color:#cbd5e1;margin:8px 0}canvas{width:100%;height:62vh;min-height:455px;background:#11151b;border:1px solid #303743;border-radius:14px;touch-action:none}.hide{display:none}.dock{position:fixed;left:8px;right:8px;bottom:max(8px,env(safe-area-inset-bottom));max-width:834px;margin:auto;background:#151a22f7;border:1px solid #354050;border-radius:16px;padding:10px;z-index:9}.dock label{display:grid;grid-template-columns:70px 1fr 58px;gap:8px;align-items:center;margin:7px 0}.dock b{text-align:right;font-size:12px}input{width:100%}</style><main><header><h1>Light Art V3.3</h1><button id="sw">Vue 2D</button></header><small id="st"></small><canvas id="c"></canvas><canvas id="m" class="hide"></canvas><div class="dock"><label>X<input id="x" type="range" min="-30" max="50" value="28"><b id="xv"></b></label><label>Y<input id="y" type="range" min="-30" max="50" value="-12"><b id="yv"></b></label><label>Z<input id="z" type="range" min="5" max="70" value="32"><b id="zv"></b></label><label>Faisceau<input id="f" type="range" min="5" max="55" value="28"><b id="fv"></b></label></div></main><script>'use strict';const C={W:20,H:20,N:13,n0:1.0003,n:1.49,filmN:1.72,filmD:360,pieces:[{x:6.5,y:13.5,s:4,a:25},{x:12,y:10.5,s:3,a:105},{x:10.5,y:5.5,s:2.5,a:-20}]},S={view:3,x:28,y:-12,z:32,beam:28,yaw:-.75,pitch:.72,drag:0,px:0,py:0};const c=document.querySelector('#c'),m=document.querySelector('#m'),g=c.getContext('2d'),h=m.getContext('2d'),st=document.querySelector('#st');const V=(x,y,z)=>({x,y,z}),add=(a,b)=>V(a.x+b.x,a.y+b.y,a.z+b.z),sub=(a,b)=>V(a.x-b.x,a.y-b.y,a.z-b.z),mul=(a,k)=>V(a.x*k,a.y*k,a.z*k),dot=(a,b)=>a.x*b.x+a.y*b.y+a.z*b.z,cross=(a,b)=>V(a.y*b.z-a.z*b.y,a.z*b.x-a.x*b.z,a.x*b.y-a.y*b.x),norm=a=>mul(a,1/(Math.hypot(a.x,a.y,a.z)||1)),src=()=>V(S.x,S.y,S.z),aim=()=>V(10,10,0);function frame(p){let a=p.a*Math.PI/180,u=V(Math.cos(a),Math.sin(a),0);return{u,n:norm(V(-Math.sin(a),Math.cos(a),0)),b:V(p.x,p.y,0)}}function point(p,u,z){let q=frame(p);return add(add(q.b,mul(q.u,(u-.5)*p.s)),V(0,0,z*p.s))}function corners(p){let q=frame(p),a=add(q.b,mul(q.u,-p.s/2)),b=add(q.b,mul(q.u,p.s/2));return[a,b,add(b,V(0,0,p.s)),add(a,V(0,0,p.s))]}function hit(o,d){if(d.z>=-1e-7)return null;let t=-o.z/d.z;return t>0?add(o,mul(d,t)):null}function reflect(i,n){return sub(i,mul(n,2*dot(i,n)))}function refract(i,n,n1,n2){let ci=Math.max(0,Math.min(1,-dot(n,i))),eta=n1/n2,k=1-eta*eta*(1-ci*ci);return k<0?null:norm(add(mul(i,eta),mul(n,eta*ci-Math.sqrt(k))))}function beam(q){let a=norm(sub(aim(),src())),d=norm(sub(q,src())),co=Math.cos(S.beam*Math.PI/180),v=dot(a,d);return v>co?(v-co)/(1-co):0}function wlRGB(w){let r=0,g=0,b=0;if(w<440){r=-(w-440)/60;b=1}else if(w<490){g=(w-440)/50;b=1}else if(w<510){g=1;b=-(w-510)/20}else if(w<580){r=(w-510)/70;g=1}else if(w<645){r=1;g=-(w-645)/65}else r=1;let f=w<420?.3+.7*(w-380)/40:w>700?.3+.7*(780-w)/80:1;return[r*f,g*f,b*f]}const WLS=[400,420,440,460,480,500,520,540,560,580,600,620,640,660,680,700];function spectral(ci){let si=Math.sqrt(Math.max(0,1-ci*ci)),st=C.n0/C.filmN*si,ct=Math.sqrt(Math.max(0,1-st*st)),R=[],T=[];for(let w of WLS){let phase=4*Math.PI*C.filmN*C.filmD*ct/w,base=.08,rr=Math.min(.92,base+.78*.5*(1+Math.cos(phase))),tt=Math.max(.03,1-rr);R.push(rr);T.push(tt)}return{R,T}}function color(spec,weight){let R=0,G=0,B=0,sum=0;for(let k=0;k<WLS.length;k++){let q=wlRGB(WLS[k]),v=spec[k];R+=q[0]*v;G+=q[1]*v;B+=q[2]*v;sum+=v}let mx=Math.max(R,G,B,1e-6),gain=Math.min(1,.28+weight*3);return`rgba(${Math.round(255*Math.pow(R/mx,.8))},${Math.round(255*Math.pow(G/mx,.8))},${Math.round(255*Math.pow(B/mx,.8))},${gain})`}function trace(p){let out=[],F=frame(p);for(let i=0;i<C.N;i++)for(let j=0;j<C.N;j++){let q=point(p,(i+.5)/C.N,(j+.5)/C.N),B=beam(q);if(!B)continue;let inc=norm(sub(q,src())),side=dot(sub(src(),F.b),F.n)>=0?1:-1,n=mul(F.n,side),ci=Math.max(0,-dot(n,inc));if(ci<.002)continue;let rr=norm(reflect(inc,n)),inside=refract(inc,n,C.n0,C.n),tt=inside&&refract(inside,n,C.n,C.n0);let r=hit(q,rr),t=tt&&hit(q,tt),sp=spectral(ci);if(r||t)out.push({q,r,t,cr:color(sp.R,B),ct:color(sp.T,B*.72),ci,B})}return out}function basis(){let t=V(10,10,1.5),d=48,cc=Math.cos(S.pitch),p=V(t.x+d*cc*Math.cos(S.yaw),t.y+d*cc*Math.sin(S.yaw),t.z+d*Math.sin(S.pitch)),f=norm(sub(t,p)),r=norm(cross(f,V(0,0,1))),u=norm(cross(r,f));return{p,f,r,u}}function proj(q,el){let R=el.getBoundingClientRect(),B=basis(),v=sub(q,B.p),z=dot(v,B.f);if(z<.1)return null;let F=Math.min(R.width,R.height)*1.16;return{x:R.width/2+F*dot(v,B.r)/z,y:R.height/2-F*dot(v,B.u)/z}}function line(a,b,col,dash=[]){let A=proj(a,c),B=proj(b,c);if(!A||!B)return;g.save();g.beginPath();g.moveTo(A.x,A.y);g.lineTo(B.x,B.y);g.strokeStyle=col;g.setLineDash(dash);g.stroke();g.restore()}function poly(P,fill,stroke){let Q=P.map(x=>proj(x,c));if(Q.some(x=>!x))return;g.beginPath();g.moveTo(Q[0].x,Q[0].y);Q.slice(1).forEach(x=>g.lineTo(x.x,x.y));g.closePath();g.fillStyle=fill;g.fill();g.strokeStyle=stroke;g.stroke()}function cone(){let s=src(),a=norm(sub(aim(),s)),helper=Math.abs(a.z)<.9?V(0,0,1):V(1,0,0),u=norm(cross(a,helper)),v=norm(cross(u,a)),th=S.beam*Math.PI/180,ends=[];for(let k=0;k<12;k++){let A=k*Math.PI/6,d=norm(add(mul(a,Math.cos(th)),mul(add(mul(u,Math.cos(A)),mul(v,Math.sin(A))),Math.sin(th))));ends.push(hit(s,d)||add(s,mul(d,70)))}ends.forEach(e=>line(s,e,'rgba(255,227,146,.20)',[3,5]));line(s,aim(),'#ffe392',[5,4])}function render3(){let R=c.getBoundingClientRect();g.clearRect(0,0,R.width,R.height);poly([V(0,0,0),V(20,0,0),V(20,20,0),V(0,20,0)],'#24405a66','#bfe1ff');for(let i=0;i<=20;i+=2){line(V(i,0,0),V(i,20,0),'#ffffff18');line(V(0,i,0),V(20,i,0),'#ffffff18')}cone();let all=[],lit=0;C.pieces.forEach(p=>{let A=trace(p);all.push(...A);if(A.length)lit++;A.forEach((r,k)=>{if(k%9==0){if(r.r)line(r.q,r.r,r.cr);if(r.t)line(r.q,r.t,r.ct,[4,4])}if(r.r){let q=proj(r.r,c);if(q){g.fillStyle=r.cr;g.fillRect(q.x-1.5,q.y-1.5,3,3)}}if(r.t){let q=proj(r.t,c);if(q){g.fillStyle=r.ct;g.fillRect(q.x-1.5,q.y-1.5,3,3)}}});poly(corners(p),'#d5f0ff22','#e6f7ff')});let q=proj(src(),c);if(q){g.fillStyle='#fffbd0';g.beginPath();g.arc(q.x,q.y,5,0,7);g.fill()}let av=all.length?all.reduce((a,r)=>a+Math.acos(r.ci)*180/Math.PI,0)/all.length:0;st.textContent=`${lit}/3 plaques • ${all.length} impacts • iridescence spectrale • incidence moy. ${av.toFixed(1)}°`}
function render2(){let R=m.getBoundingClientRect();h.clearRect(0,0,R.width,R.height);let sets=C.pieces.map(trace),pts=[V(0,0,0),V(20,20,0)];sets.forEach(A=>A.forEach(r=>{if(r.r)pts.push(r.r);if(r.t)pts.push(r.t)}));let minX=Math.min(...pts.map(p=>p.x)),maxX=Math.max(...pts.map(p=>p.x)),minY=Math.min(...pts.map(p=>p.y)),maxY=Math.max(...pts.map(p=>p.y)),K=Math.min((R.width-40)/(maxX-minX||1),(R.height-40)/(maxY-minY||1)),mp=p=>({x:20+(p.x-minX)*K,y:R.height-20-(p.y-minY)*K});let A=mp(V(0,0,0)),B=mp(V(20,20,0));h.fillStyle='#24405a66';h.fillRect(A.x,B.y,B.x-A.x,A.y-B.y);h.strokeStyle='#bfe1ff';h.strokeRect(A.x,B.y,B.x-A.x,A.y-B.y);sets.forEach(T=>T.forEach(r=>{if(r.r){let q=mp(r.r);h.fillStyle=r.cr;h.fillRect(q.x-2,q.y-2,4,4)}if(r.t){let q=mp(r.t);h.fillStyle=r.ct;h.fillRect(q.x-2,q.y-2,4,4)}}))}function size(){[c,m].forEach(el=>{let R=el.getBoundingClientRect(),d=devicePixelRatio||1;el.width=Math.round(R.width*d);el.height=Math.round(R.height*d);el.getContext('2d').setTransform(d,0,0,d,0,0)});render()}function render(){S.view==3?render3():render2()}[['x','x','cm'],['y','y','cm'],['z','z','cm'],['f','beam','°']].forEach(([id,key,u])=>{let e=document.querySelector('#'+id),v=document.querySelector('#'+id+'v');function go(){S[key]=+e.value;v.textContent=e.value+' '+u;render()}e.oninput=go;go()});document.querySelector('#sw').onclick=e=>{S.view=S.view==3?2:3;c.classList.toggle('hide',S.view!=3);m.classList.toggle('hide',S.view!=2);e.target.textContent=S.view==3?'Vue 2D':'Vue 3D';size()};c.onpointerdown=e=>{S.drag=1;S.px=e.clientX;S.py=e.clientY;c.setPointerCapture(e.pointerId)};c.onpointermove=e=>{if(!S.drag)return;S.yaw-=(e.clientX-S.px)*.008;S.pitch=Math.max(.15,Math.min(1.45,S.pitch+(e.clientY-S.py)*.008));S.px=e.clientX;S.py=e.clientY;render()};c.onpointerup=()=>S.drag=0;new ResizeObserver(size).observe(document.querySelector('main'));addEventListener('resize',size);addEventListener('pageshow',()=>setTimeout(size,50));requestAnimationFrame(size);setTimeout(size,300);s
